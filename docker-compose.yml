services:
  telemetry-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: telemetry_server
    ports:
      - "9001:9001/udp"
      - "9002:9002/tcp"
    env_file:
      - ./server/config/server.env.example
    volumes:
      - telemetry-data:/app/data
    restart: unless-stopped

  operator-web:
    build:
      context: ./operator-client
      dockerfile: Dockerfile
    container_name: operator_web
    environment:
      TELEMETRY_SERVER_HOST: telemetry-server
      TELEMETRY_SERVER_PORT: "9002"
      OPERATOR_WEB_PORT: "3000"
    ports:
      - "3000:3000/tcp"
    depends_on:
      - telemetry-server
    restart: unless-stopped

volumes:
  telemetry-data:
